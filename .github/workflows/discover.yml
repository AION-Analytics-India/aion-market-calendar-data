name: Official calendar source review
on:
  push:
    branches: [review/calendar-parity-20261115]
    paths: ['ingest/**','.github/workflows/discover.yml']
  schedule: [{cron: '17 2 * * *'}]
  repository_dispatch: {types: [calendar-notice-received]}
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: official-calendar-discovery, cancel-in-progress: false}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .review/sources.json
          key: official-discovery-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: official-discovery-
      - run: python -m ingest.discover .review/sources.json
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always() && hashFiles('.review/sources.json') != ''
        with:
          path: .review/sources.json
          key: official-discovery-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: source-review, path: .review/sources.json, include-hidden-files: true}
